name: Publicar versión

# Al subir una etiqueta v1.2.3 se arman las descargas y se publica la versión:
#   mufa-instalador-windows.exe, mufa-windows.zip (la misma app sin instalar),
#   mufa-macos.dmg, mufa-servidor.zip (Docker)
#   y la imagen ghcr.io/<propietario>/mufa:<versión>, con sus SHA-256.
# A mano (Actions > Publicar versión > Run workflow) arma las descargas de
# escritorio para probarlas, sin publicar nada.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - run: npm ci --no-fund && npm run build
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web
          path: src/mufa/web

  escritorio:
    needs: web
    strategy:
      matrix:
        include:
          - os: windows-latest
            nombre: windows
          - os: macos-latest
            nombre: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web
          path: src/mufa/web
      - name: Versión
        shell: bash
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/mufa/__init__.py)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --all-groups
      - run: uv run pyinstaller empaquetado/mufa.spec --noconfirm --distpath dist --workpath build
      - name: Probar que la app arranca (sin ventana)
        shell: bash
        env:
          MUFA_DIR_DATOS: ${{ runner.temp }}/mufa-prueba
          MUFA_SIN_VENTANA: "1"
        run: |
          ./dist/${{ matrix.nombre == 'windows' && 'mufa/mufa.exe' || 'mufa.app/Contents/MacOS/mufa' }} &
          for intento in $(seq 1 60); do
            curl -fs http://127.0.0.1:8080/api/v1/salud && exit 0
            sleep 2
          done
          exit 1
      - name: Instalador de Windows
        if: matrix.nombre == 'windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          & $iscc /Q "/DVersion=$env:VERSION" empaquetado\windows\mufa.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Move-Item dist\mufa-instalador-windows.exe .
      - name: Paquete para la Microsoft Store
        # La tienda lo firma. La identidad sale de Partner Center y se guarda en
        # Settings > Secrets and variables > Actions > Variables del repositorio.
        if: matrix.nombre == 'windows'
        shell: pwsh
        env:
          MSIX_NOMBRE: ${{ vars.MSIX_NOMBRE }}
          MSIX_EDITOR: ${{ vars.MSIX_EDITOR }}
          MSIX_EDITOR_VISIBLE: ${{ vars.MSIX_EDITOR_VISIBLE }}
          MSIX_NOMBRE_VISIBLE: ${{ vars.MSIX_NOMBRE_VISIBLE }}
        run: |
          uv run --no-project --with pillow python empaquetado/windows/msix.py $env:VERSION
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName | Select-Object -Last 1
          & $makeappx.FullName pack /d build\msix /p mufa-tienda.msix /o
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Guardar el paquete de la tienda (se sube a mano en Partner Center)
        if: matrix.nombre == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mufa-tienda
          path: mufa-tienda.msix
          if-no-files-found: error
      - name: Empaquetar
        shell: bash
        run: |
          mkdir paquete
          if [ "${{ matrix.nombre }}" = windows ]; then
            cp -R dist/mufa empaquetado/LEEME-windows.txt paquete/
            cd paquete && 7z a ../mufa-windows.zip . > /dev/null
          else
            # Una firma rota es lo que hace que macOS diga "mufa está dañado".
            codesign --verify --deep --strict dist/mufa.app
            # Imagen de disco como cualquier app de Mac: mufa.app y un acceso a
            # Aplicaciones para arrastrarla. ditto conserva la firma y los enlaces.
            ditto dist/mufa.app paquete/mufa.app
            ln -s /Applications paquete/Aplicaciones
            cp empaquetado/LEEME-macos.txt paquete/LEEME.txt
            hdiutil create -volname mufa -srcfolder paquete -fs HFS+ -format UDZO -ov mufa-macos.dmg
            # La app dentro de la imagen sigue entera y firmada.
            hdiutil attach -nobrowse -readonly -mountpoint /tmp/mufa-dmg mufa-macos.dmg
            codesign --verify --deep --strict /tmp/mufa-dmg/mufa.app
            test "$(defaults read /tmp/mufa-dmg/mufa.app/Contents/Info.plist CFBundleShortVersionString)" = "$VERSION"
            hdiutil detach /tmp/mufa-dmg
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mufa-${{ matrix.nombre }}
          path: |
            mufa-windows.zip
            mufa-instalador-windows.exe
            mufa-macos.dmg
          if-no-files-found: error

  servidor:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Imagen Docker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          imagen="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mufa"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$imagen:$version" -t "$imagen:latest" .
          docker push "$imagen:$version"
          docker push "$imagen:latest"
          echo "IMAGEN=$imagen:$version" >> "$GITHUB_ENV"
      - name: Paquete de servidor
        run: |
          mkdir mufa-servidor
          cp empaquetado/servidor/* empaquetado/servidor/.env.ejemplo Caddyfile mufa-servidor/
          sed -i "s|ghcr.io/PROPIETARIO/mufa:VERSION|$IMAGEN|" mufa-servidor/docker-compose.yml
          sed -i "s|PROPIETARIO/mufa|${GITHUB_REPOSITORY}|" mufa-servidor/LEEME.txt
          chmod +x mufa-servidor/instalar.sh
          zip -qr mufa-servidor.zip mufa-servidor
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mufa-servidor
          path: mufa-servidor.zip

  publicar:
    if: github.ref_type == 'tag'
    needs: [escritorio, servidor]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: descargas
          merge-multiple: true
      - name: Crear la versión en GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd descargas
          sha256sum *.exe *.dmg *.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.exe *.dmg *.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "mufa $GITHUB_REF_NAME" --generate-notes
