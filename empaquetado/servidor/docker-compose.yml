# mufa en un servidor, con HTTPS automático (Caddy).
#
# Lo más fácil: sudo sh instalar.sh (pregunta la dirección, arranca y muestra
# el token). A mano: copia .env.ejemplo a .env, pon la IP o el dominio en
# MUFA_DOMINIO y ejecuta docker compose up -d.

services:
  mufa:
    image: ${MUFA_IMAGEN:-ghcr.io/PROPIETARIO/mufa:VERSION}
    restart: unless-stopped
    volumes:
      - mufa-datos:/datos
    environment:
      MUFA_SONDEO_MINUTOS: ${MUFA_SONDEO_MINUTOS:-5}
      MUFA_RESPALDO_HORAS: ${MUFA_RESPALDO_HORAS:-24}
      # Zona horaria: el respaldo diario corre a la hora elegida en esta zona.
      TZ: ${TZ:-UTC}
      # Solo se le habla con el nombre que sirve Caddy (contra el DNS rebinding).
      MUFA_HOSTS_PERMITIDOS: ${MUFA_DOMINIO:-localhost},127.0.0.1,localhost
      MUFA_RETENCION_DIAS: ${MUFA_RETENCION_DIAS:-7}
    # Sin "ports": a mufa solo se llega a través de Caddy, con HTTPS.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - mufa
    ports:
      - "80:80"
      - "443:443"
    environment:
      MUFA_DOMINIO: ${MUFA_DOMINIO:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-datos:/data
      - caddy-config:/config

volumes:
  mufa-datos:
  caddy-datos:
  caddy-config:
